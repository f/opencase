schema: case-test/v0.1

case: {id: official.son-prova, version: 0.4.1}

scenario:
  id: locked_evidence_requires_exact_search
  perspective: detective
  description: The audit stays hidden until the phone clue offers its exact search; blind or plausible queries do not open it.
  steps:
    - expect:
        state:
          evidence:
            audit_draft: hidden
            company_registry: hidden
          affordances: {search_production_audit: hidden}
          unknown_observations: [audit_draft.payments_diverted_to]

    - detective.observe: audit_draft
      expect:
        result: {status: denied, code: evidence-locked}
        state: {evidence: {audit_draft: hidden}}

    - detective.act: {action: search, query: "Orhan production audit"}
      expect:
        result: {status: denied, code: affordance-unavailable}
        state:
          clocks: {case-time: 0s}
          evidence: {audit_draft: hidden}

    - detective.act: {action: request, from: ekin, topic: scene-report}
    - detective.observe: safety_report
    - detective.act: {action: request, from: ekin, topic: victim-phone}
    - detective.observe: orhan_phone_export
    - detective.observe: positioning_message
      expect:
        state:
          clocks: {case-time: 7m}
          evidence: {audit_draft: hidden}
          affordances: {search_production_audit: offered}

    - detective.act: {action: search, query: "Orhan audit"}
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 11m}
          evidence: {audit_draft: hidden}
          affordances: {search_production_audit: offered}

    - detective.act: {action: search, query: "Orhan production audit"}
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 15m}
          evidence: {audit_draft: available}
          affordances: {search_production_audit: hidden}

    - detective.observe: audit_draft
      expect:
        result: {status: accepted}
        state:
          evidence:
            audit_draft: observed
            company_registry: available
          observations:
            audit_draft.payments_diverted_to: north_stage
            audit_draft.disclosure_prepared_by: orhan
