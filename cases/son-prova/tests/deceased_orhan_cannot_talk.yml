schema: case-test/v0.1

case:
  id: official.son-prova
  version: 0.4.1

scenario:
  id: deceased_orhan_cannot_talk
  perspective: detective
  description: A deceased actor rejects interviews before and after evidence acquisition without changing case state.
  steps:
    - detective.act: {action: interview, actor: orhan}
      expect:
        result: {status: denied, code: actor-unavailable}
        state:
          clocks: {case-time: 0s}
          evidence:
            pin_photo: hidden

    - detective.act: {action: request, from: ekin, topic: scene-report}
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 4m}
          evidence: {pin_photo: available}

    - detective.observe: pin_photo
      expect: {result: {status: accepted}}

    - detective.act: {action: interview, actor: orhan, topic: safety-pin}
      expect:
        result: {status: denied, code: actor-unavailable}
        state:
          clocks: {case-time: 4m}
          evidence:
            pin_photo: observed
