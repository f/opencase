schema: case-test/v0.1

case:
  id: official.son-prova
  version: 0.4.1

scenario:
  id: offline_resume
  perspective: detective
  description: Resume after twelve offline hours and verify both overdue consequences through public state.
  steps:
    - detective.resume: {after: 12h}
      expect:
        result: {status: accepted}
        state:
          clocks:
            wall: 12h
          evidence:
            audit_draft: hidden
            workspace_admin_log: available
            payment_ledger: available

    - detective.conclude: baran
      expect:
        result: {status: accepted}
        state:
          final_conclusion: baran
          outcome: wrong_stage
