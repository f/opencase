schema: case-test/v0.1

case: {id: official.son-prova, version: 0.4.2}

scenario:
  id: early_correct_hunch
  perspective: detective
  description: Reveal the person, name the right person immediately, and receive accuracy credit without proof credit.
  steps:
    - expect:
        state:
          status: active
          clocks: {case-time: 0s}
          affordances:
            conclude_selin: hidden
            conclude_baran: hidden
            conclude_leyla: hidden

    - detective.conclude: selin
      expect:
        result: {status: denied, code: affordance-unavailable}
        state:
          status: active
          clocks: {case-time: 0s}
          contacts: {selin: hidden}

    - detective.act: {action: locate-contact, target: selin}
      expect:
        result: {status: accepted}
        state:
          status: active
          clocks: {case-time: 0s}
          contacts: {selin: listed, baran: hidden, leyla: hidden}
          affordances:
            conclude_selin: offered
            conclude_baran: hidden
            conclude_leyla: hidden

    - detective.conclude: selin
      expect:
        result: {status: accepted}
        state:
          status: ended
          clocks: {case-time: 1m}
          final_conclusion: selin
          outcome: right_instinct_weak_case
          assessment: {score: 15, max_score: 100}

    - detective.act: {action: request, from: ekin, topic: scene-report}
      expect:
        result: {status: denied, code: case-ended}
        state:
          status: ended
          final_conclusion: selin
          outcome: right_instinct_weak_case
