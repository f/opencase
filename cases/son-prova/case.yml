  request_livestream_archive:
    label: {$text: affordances.request_livestream_archive.label}
    result: {$text: affordances.request_livestream_archive.result}
    surface: phone
    initial: withdrawn
    action: {action: request, from: ekin, topic: livestream-archive}
    cost: {clock: case-time, by: 3m}
  locate_leyla_contact:
    label: {$text: affordances.locate_leyla_contact.label}
    result: {$text: affordances.locate_leyla_contact.result}
    surface: inbox
    initial: offered
    action: {action: locate-contact, target: leyla}
    interaction:
      kind: async-message
      channel: forensics
      request: {$text: affordances.locate_leyla_contact.request}
