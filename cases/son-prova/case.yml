# Human-authored package source. The compiler expands this into private IR.
schema: case-source/v0.1

case:
  id: official.son-prova
  version: 0.4.1
  title: {$text: case.title}
  locale: tr
  duration: 60m
  mode: elastic
  final_conclusion: first-write-wins
  time:
    date: 2026-10-17
    timezone: Europe/Istanbul
    starts_at: "21:35"
  synopsis: {$text: case.synopsis}

use: [investigation@1, comms@1, artifacts@1, virtual-web@1,
      casebook@1, interview@1, media-forensics@1,
      stage-automation@1, finance@1, contact-directory@1]

authoring:
  evidence_source_policy: implicit-per-evidence
  tests_enforce_evidence_access: true

assets:
  safety-pin-photo:
    kind: image
    source: {local: assets/safety-pin-photo.png}
    mime_type: image/png
    visibility: public
    integrity:
      sha256: ce2bdbe643070251ffe436527fd9017c1ee09ed1380052cf9960b578954328ed

cast:
  ekin:
    {name: Ekin Soylu, role: {$text: cast.ekin.role}, client: true,
     phone: "+90 555 000 21 01", operator: Marmara Mobil,
     contact_source: {$text: contacts.ekin.source}}
  orhan:
    {name: Orhan Demir, role: {$text: cast.orhan.role}, status: deceased,
     public: false}
  leyla:
    {name: Leyla Aras, role: {$text: cast.leyla.role},
     phone: "+90 555 000 21 02", operator: SahneCell,
     contact_source: {$text: contacts.leyla.source}}
  baran:
    {name: Baran Kılıç, role: {$text: cast.baran.role},
     phone: "+90 555 000 21 03", operator: Perde Mobil,
     contact_source: {$text: contacts.baran.source}}
  selin:
    {name: Selin Aksoy, role: {$text: cast.selin.role},
     phone: "+90 555 000 21 04", operator: Mavi Hat,
     contact_source: {$text: contacts.selin.source}}

conversations:
  ekin:
    contact: {initial: listed}
    initial: available
    states:
      available: {can_talk: true}
    channels: {request: from}
  orhan:
    contact: {initial: hidden}
    initial: deceased
    states:
      deceased:
        can_talk: false
        reason: {$text: conversations.orhan.states.deceased.reason}
    channels: {interview: actor, present: target}
  leyla:
    contact: {initial: hidden}
    initial: available
    states:
      available: {can_talk: true}
    channels: {interview: actor, present: target}
  baran:
    contact: {initial: hidden}
    initial: available
    states:
      available: {can_talk: true}
      detained:
        can_talk: false
        reason: {$text: conversations.baran.states.detained.reason}
    channels: {interview: actor, present: target}
  selin:
    contact: {initial: hidden}
    initial: available
    states:
      available: {can_talk: true}
      escaped:
        can_talk: false
        reason: {$text: conversations.selin.states.escaped.reason}
    channels: {interview: actor, present: target}

# Public, localized investigation choices. Later commands stay withdrawn until
# an observed clue or supported theory makes them a fair next step.
affordances:
  request_scene_report:
    label: {$text: affordances.request_scene_report.label}
    result: {$text: affordances.request_scene_report.result}
    surface: phone
    initial: offered
    action: {action: request, from: ekin, topic: scene-report}
    cost: {clock: case-time, by: 4m}
  request_automation_export:
    label: {$text: affordances.request_automation_export.label}
    result: {$text: affordances.request_automation_export.result}
    surface: phone
    initial: offered
    action: {action: request, from: ekin, topic: automation-export}
    cost: {clock: case-time, by: 4m}
  request_victim_phone:
