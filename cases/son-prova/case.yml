    result: {$text: affordances.locate_baran_contact.result}
    surface: inbox
    initial: offered
    action: {action: locate-contact, target: baran}
    interaction:
      kind: async-message
      channel: forensics
      request: {$text: affordances.locate_baran_contact.request}
      context: {kind: opening-call}
