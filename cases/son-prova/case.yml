  request_security_export:
    label: {$text: affordances.request_security_export.label}
    result: {$text: affordances.request_security_export.result}
    surface: phone
    initial: withdrawn
    action: {action: request, from: ekin, topic: security-export}
    cost: {clock: case-time, by: 3m}
  search_remote_pairing:
    label: {$text: affordances.search_remote_pairing.label}
    result: {$text: affordances.search_remote_pairing.result}
