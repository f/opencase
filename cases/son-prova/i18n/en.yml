  assessment.criteria.baran_operator.met: You proved that Baran could not have issued the automation command.
  assessment.criteria.baran_operator.missed: The evidence chain excluding Baran from the automation command was not completed.
  assessment.criteria.culprit.met: You established with a complete evidence chain that Selin killed Orhan.
  assessment.criteria.culprit.missed: The person responsible for the murder was not established with evidence.
  assessment.criteria.death_cause.met: You used the technical records to show that the death was not an accident.
  assessment.criteria.death_cause.missed: Whether the death was deliberate remained unresolved.
  assessment.criteria.financial_motive.met: You verified Selin's financial motive through company and payment records.
  assessment.criteria.financial_motive.missed: The financial motive was not connected to the evidence chain.
  assessment.criteria.preparation.met: You proved that Selin prepared the system before the murder.
  assessment.criteria.preparation.missed: Advance preparation for the murder was not established.
  assessment.criteria.selin_alibi.met: You found that Selin's livestream alibi relied on an older recording.
  assessment.criteria.selin_alibi.missed: Selin's livestream alibi was not tested technically.
  assessment.criteria.preserve_finance.met: You preserved Orhan's financial workspace before it was deleted.
  assessment.criteria.preserve_finance.missed: Orhan's financial records were not preserved.
  assessment.criteria.stop_selin.met: You completed the final action before Selin left the scene.
  assessment.criteria.stop_selin.missed: Selin left before the final action could stop her.
  assessment.criteria.clear_leyla.met: You kept Leyla outside the accusation by completing the preparation chain.
  assessment.criteria.clear_leyla.missed: Leyla carried an unnecessary accusation, or the chain clearing her was incomplete.
  assessment.criteria.protect_baran.met: You cleared Baran with evidence and prevented accusation or detention harm.
  assessment.criteria.protect_baran.missed: Baran was accused, detained, or left without the evidence chain that cleared him.
  assessment.criteria.avoid_detention.met: You completed the evidence before Baran's detention deadline.
  assessment.criteria.avoid_detention.missed: Baran was detained because the investigation took too long.
  assessment.criteria.preserve_before_deletion.met: You prevented the workspace loss before the deletion deadline.
  assessment.criteria.preserve_before_deletion.missed: The deletion deadline passed and the financial workspace was lost.
  assessment.criteria.stop_departure.met: You progressed before Selin's departure deadline.
  assessment.criteria.stop_departure.missed: Selin left before the investigation was completed.
  outcomes.full_curtain.title: Full Curtain
  outcomes.full_curtain.body: Selin is stopped with the full case proved. Orhan's financial records survive, and neither Baran nor Leyla pays for the setup.
  outcomes.bitter_applause.title: Bitter Applause
  outcomes.bitter_applause.body: Selin is stopped and the murder is solved, but an innocent person was accused or detained along the way.
  outcomes.truth_too_late.title: Truth Found, Killer Gone
  outcomes.truth_too_late.body: You proved that Selin killed Orhan, but she left before the conclusion could stop her.
  outcomes.killer_found.title: Killer Identified
  outcomes.killer_found.body: Selin is identified and stopped, but Orhan's financial evidence was lost before it could be preserved.
  outcomes.wrong_stage.title: Wrong Stage
  outcomes.wrong_stage.body: The case closes on Baran or Leyla while Selin leaves with the real plan hidden.
