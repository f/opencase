messages:
  case.title: Final Rehearsal
  case.synopsis: >-
    Director Orhan Demir dies after falling through an open stage hatch during
    rehearsal. Conflicting accounts, volatile digital records, and a rushed
    police response leave little time to reconstruct who prepared the fall.
  opening.call: >-
    Orhan Demir died after falling through the stage hatch during rehearsal.
    Police plan to detain stage manager Baran after fifty-five investigation
    minutes, and Orhan's production workspace is queued for deletion. Lead actor
    Leyla and producer Selin are still at the theatre; Selin plans to leave within
    the hour. I can release the scene report and automation export; choose what
    to request and whom to question before the records and witnesses disappear.
  cast.ekin.role: Theatre manager
  cast.orhan.role: Artistic director
  cast.leyla.role: Lead actor
  cast.baran.role: Stage manager
  cast.selin.role: Producer
