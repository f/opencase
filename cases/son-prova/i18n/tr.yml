messages:
  case.title: Son Prova
  case.synopsis: >-
    Yönetmen Orhan Demir prova sırasında açılan sahne kapağından düşerek ölür.
    Çelişkili ifadeler, silinmek üzere olan dijital kayıtlar ve acele eden polis,
    düşüşü kimin hazırladığını çözmek için çok az zaman bırakır.
  opening.call: >-
    Orhan Demir prova sırasında sahne kapağından düşerek öldü. Polis, elli beş
    soruşturma dakikası içinde sahne amiri Baran'ı gözaltına alacak; Orhan'ın
    yapım çalışma alanı da silinme kuyruğunda. Sahne inceleme raporunu ve
    otomasyon dışa aktarımını açabilirim. Kayıtlar ve tanıklar kaybolmadan önce
    neyi isteyeceğine ve kiminle konuşacağına sen karar ver.
