  assessment.criteria.stop_departure.missed: Selin soruşturma sonuçlanmadan olay yerinden ayrıldı.
  outcomes.full_curtain.title: Tam Perde
  outcomes.full_curtain.body: Selin, bütün vaka kanıtlanarak durduruldu. Orhan'ın mali kayıtları kurtuldu; Baran ve Leyla kurulan tuzağın bedelini ödemedi.
  outcomes.bitter_applause.title: Acı Alkış
  outcomes.bitter_applause.body: Selin durduruldu ve cinayet çözüldü, fakat süreçte masum biri suçlandı veya gözaltına alındı.
  outcomes.truth_too_late.title: Gerçek Bulundu, Katil Kaçtı
  outcomes.truth_too_late.body: Orhan'ı Selin'in öldürdüğünü kanıtladın, fakat sonuç onu durduramadan Selin ayrıldı.
  outcomes.killer_found.title: Katil Bulundu
  outcomes.killer_found.body: Selin tespit edilip durduruldu, fakat Orhan'ın mali kanıtları korunamadan kayboldu.
  outcomes.wrong_stage.title: Yanlış Sahne
  outcomes.wrong_stage.body: Selin gerçek plan gizli kalacak şekilde ayrılırken vaka Baran veya Leyla'nın üzerine kapandı.
