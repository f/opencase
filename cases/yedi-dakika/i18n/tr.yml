messages:
  case.title: Yedi Dakika
  case.synopsis: >-
    Haber merkezindeki kırmızı röportaj dosyası kaybolur. Lobi kaydı ilk
    bakışta editörle tartışan fotoğrafçı Mert'i işaret eder; fakat görüntü,
    yazıcı ve bina kayıtlarının zamanları birbiriyle uyuşmaz. Dosya, saat
    21:45'te alınacak gizli evrak kutuları arasındadır.
  opening.call: >-
    Kırmızı dosya yok. Mert ücretini alamadığı için benimle tartıştı ve çekip
    gitti; lobi kamerasında çıkışı görünüyor ama henüz hiçbir kaydı dışarı
    aktarmadım. Dosyada yayımlanmamış röportajın tek temiz çıktısı var. Mavi
    gizli evrak kutuları 21:45'te alınacak ve doğruca öğütücüye gidecek. Haber
    merkezi sistemlerine erişimim var; önce hangi kaydı istediğini söyle.
