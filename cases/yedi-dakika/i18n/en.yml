  assessment.criteria.camera_time.met: You verified the seven-minute difference in the camera clock.
  assessment.criteria.camera_time.missed: You continued without matching the camera clock to real time.
  assessment.criteria.full_chain.met: You explained why the file was taken with a complete evidence chain.
  assessment.criteria.full_chain.missed: The full explanation was not established with evidence.
  assessment.criteria.identify_nihan.met: You confirmed with two records that Nihan took the file.
  assessment.criteria.identify_nihan.missed: Who took the file was not established.
  assessment.criteria.locate_file.met: You found that the red file was in box B-17.
  assessment.criteria.locate_file.missed: The file's real location was not proved.
  assessment.criteria.mert_opportunity.met: You showed that Mert had no opportunity to take the file.
  assessment.criteria.mert_opportunity.missed: Mert's opportunity was not tested against the records.
  assessment.criteria.source_motive.met: You established that Nihan was trying to protect the source.
  assessment.criteria.source_motive.missed: The reason for Nihan's behavior remained unexplained.
  assessment.criteria.protect_nihan.met: You protected Nihan from unnecessary institutional damage.
  assessment.criteria.protect_nihan.missed: Nihan carried the cost of the investigation even if the file was recovered.
  assessment.criteria.protect_source.met: The confidential source's identity was protected before publication.
  assessment.criteria.protect_source.missed: The confidential source's identity remained exposed.
  assessment.criteria.recover_file.met: You recovered the red file before collection time.
  assessment.criteria.recover_file.missed: The red file was not recovered.
  assessment.criteria.avoid_early_accusation.met: You did not start action against Mert before building the evidence chain.
  assessment.criteria.avoid_early_accusation.missed: You reported Mert as a suspect before completing the deduction that cleared him.
  assessment.criteria.keep_contact_open.met: The line of communication with Mert was open when the case ended.
  assessment.criteria.keep_contact_open.missed: Contact with Mert was never repaired after the early accusation.
  assessment.criteria.beat_pickup.met: You acted before the confidential-record pickup time.
  assessment.criteria.beat_pickup.missed: The 21:45 deadline passed and the boxes were collected.
  assessment.criteria.correct_intervention.met: You did not direct the emergency action to the wrong box.
  assessment.criteria.correct_intervention.missed: The emergency order was sent to B-11 instead of B-17.
  outcomes.all_protected.title: Names Removed
  outcomes.all_protected.body: The file is recovered through mediation. Mert is cleared, Nihan is protected, and the source details are removed before publication.
  outcomes.protected_with_scar.title: Right Result, Late Apology
  outcomes.protected_with_scar.body: The file and source are protected, but Mert leaves the case carrying a false accusation that came before the evidence.
  outcomes.security_result.title: File Found, Damage Done
  outcomes.security_result.body: Security recovers the file from B-17, but Nihan is suspended and the confidential source remains exposed.
  outcomes.wrong_box_result.title: B-11
  outcomes.wrong_box_result.body: The emergency order targets the finance box. The real file stays in B-17 and is destroyed at pickup.
  outcomes.deadline_result.title: "21:45"
  outcomes.deadline_result.body: The collection vehicle takes the confidential boxes. The red file reaches the shredder before it can be recovered.
