  evidence.building_route.findings.department: It belongs to the newsroom department.
  evidence.building_route.findings.box: The fourth-floor blue confidential box is B-17.
  evidence.building_route.findings.pickup_at: Box B-17 will be collected at 21:45.
  evidence.nihan_confession.title: Nihan's confession
  evidence.nihan_confession.description: Nihan's full statement after she is shown the exposed source details.
