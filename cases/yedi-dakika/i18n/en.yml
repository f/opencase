messages:
  case.title: Seven Minutes
  case.synopsis: >-
    A red interview file disappears from a newsroom. The lobby recording first
    points to a visitor leaving after an argument, but the video, printer, and
    building records disagree about the timing. The file is among confidential
    boxes due for pickup at 21:45.
  opening.call: >-
    The red file is gone. I argued about payment with someone visiting during
    the evening shift, and he walked out; the lobby camera shows him leaving,
    but I have not exported any record yet. Publishing coordinator Nihan is
    still at the newsroom too. The file contains the only clean copy of an
    unpublished interview. The blue confidential boxes will be collected at
    21:45 and taken straight to the shredder. I can access the newsroom
    systems; tell me which record you want first.
