  affordances.deduce_camera_time.result: The camera was seven minutes fast. Mert's real exit time was 20:57.
  affordances.deduce_mert_no_opportunity.result: Mert left the building at 20:57; printing of the red file finished at 20:59:06. He had no opportunity to take it.
  affordances.deduce_nihan_took_file.result: Nihan entered the fourth floor seconds before the file was removed. The access and camera records confirm that she took the red file.
  affordances.deduce_nihan_protected_source.result: The draft exposed the confidential source, and Nihan had already asked for that information to be removed. She took the file to protect the source.
  affordances.deduce_file_in_b17.result: The box in Nihan's confession matches the fourth-floor box in the building route. The red file is in box B-17.
  affordances.deduce_full_explanation.result: Mert left before the file was printed. Nihan took it to protect the confidential source and placed it in box B-17.
  affordances.interview_leyla.result: Leyla says Mert argued about his unpaid fee and left near the time the file disappeared.
  affordances.interview_nihan.result: Nihan denies taking the file and gives no clear reason for being on the fourth floor.
  affordances.interview_mert_location.result: Mert says he left at 20:57 and paid at Karaköy Coffee minutes later. He sends his receipt.
  affordances.request_lobby_video.result: The lobby recording is ready to inspect in Files.
  affordances.request_camera_sync.result: The maintenance email about CAM-L01's clock is ready to inspect.
  affordances.request_printer_log.result: The verified central printer record is ready to inspect.
  affordances.accuse_mert.confirmation: Record Mert as the suspect? He may refuse further questions, and a false accusation will remain part of the case.
  affordances.apologize_mert.result: Mert accepts the apology and is willing to speak again, although some trust is lost.
  affordances.request_access_log.result: The fourth-floor access record is ready to inspect.
  affordances.request_desk_camera.result: The editorial desk camera recording is ready to inspect.
  affordances.request_interview_draft.result: Interview draft v12 is ready to inspect.
  affordances.request_facilities_chat.result: The facilities correspondence about confidential boxes is ready to inspect.
  affordances.search_redaction_warning.result: An unanswered redaction warning from Nihan was found in the mail archive.
  affordances.search_building_route.result: The building route for the fourth floor's confidential blue box was found.
  affordances.present_draft_to_nihan.result: Nihan admits taking the file to protect the exposed source and says she placed it in box B-17.
  affordances.recover_box_b11.confirmation: Send the recovery order for B-11 and end the case? If the box number is wrong, the real file will be destroyed.
  affordances.conclude_mediate.confirmation: Order the mediated recovery and end the case? This protects the source and avoids treating Nihan as a thief.
  affordances.conclude_security.confirmation: Send security to B-17 and end the case? The file should be recovered, but Nihan will be suspended and the source may be exposed.
  evidence.lobby_video.title: Lobby camera recording
  evidence.lobby_video.description: CAM-L01 footage showing Mert leaving the building after the argument.
  evidence.lobby_video.findings.actor: The person leaving is Mert.
  evidence.lobby_video.findings.screen_exit_at: The camera timestamp shows Mert exiting at 21:04.
  evidence.lobby_video.findings.continuity: The recording is continuous, with no missing frames around the exit.
  evidence.camera_sync_notice.title: CAM-L01 clock notice
  evidence.camera_sync_notice.description: A maintenance email about the lobby camera's clock synchronization.
  evidence.camera_sync_notice.findings.device: The notice applies to lobby camera CAM-L01.
  evidence.camera_sync_notice.findings.clock_offset: Its clock was seven minutes fast.
  evidence.camera_sync_notice.findings.measured_at: The offset was measured at 18:12 on the same day.
  evidence.camera_sync_notice.findings.correction_status: The correction was still pending when the file disappeared.
  evidence.printer_log.title: Central printer log
  evidence.printer_log.description: A signed job record from editorial printer PRN-ED04.
  evidence.printer_log.findings.object: The completed job was the red interview file.
  evidence.printer_log.findings.completed_at: Printing finished at 20:59:06.
  evidence.printer_log.findings.pages: The job contained 46 pages.
  evidence.printer_log.findings.clock_source: The printer used the central time server, so its timestamp is reliable.
  evidence.mert_receipt.title: Mert's café receipt
  evidence.mert_receipt.description: A payment receipt sent by Mert after his interview.
  evidence.mert_receipt.findings.actor: The payment belongs to Mert.
  evidence.mert_receipt.findings.place: It was made at Karaköy Coffee.
  evidence.mert_receipt.findings.paid_at: The payment completed at 21:01:12.
  evidence.mert_receipt.findings.payment: It was a contactless payment, creating an automatic timestamp.
  evidence.access_log.title: Fourth-floor access log
  evidence.access_log.description: Building access records from the minutes when the file vanished.
  evidence.access_log.findings.actor: The recorded badge belongs to Nihan.
  evidence.access_log.findings.entered_at: Nihan entered the fourth floor at 21:03:14.
  evidence.access_log.findings.service_corridor_at: Her badge reached the service corridor at 21:08:51.
  evidence.desk_camera.title: Editorial desk camera
  evidence.desk_camera.description: CAM-E04 footage covering the desk where the red file was left.
  evidence.desk_camera.findings.visible_at: The red file was still on the desk at 21:02:09.
  evidence.desk_camera.findings.file_removed_at: Someone removed it at 21:04:01.
  evidence.desk_camera.findings.direction: The person carried the file toward the service corridor.
  evidence.desk_camera.findings.visible_actor: Only a light-colored sleeve is visible; the person's face is not.
  evidence.interview_draft.title: Interview draft v12
  evidence.interview_draft.description: The missing red file's digital draft.
  evidence.interview_draft.findings.document: This is version 12 of the unpublished interview.
  evidence.interview_draft.findings.source_identity_exposed: The draft exposes the confidential source's identity.
  evidence.interview_draft.findings.exposed_person: The exposed source is Can Koral.
  evidence.interview_draft.findings.exposed_locations: It also names two places connected to the source.
  evidence.nihan_warning.title: Nihan's redaction warning
  evidence.nihan_warning.description: An email asking Leyla to remove source details from interview draft v12.
  evidence.nihan_warning.findings.sent_by: Nihan sent the warning.
  evidence.nihan_warning.findings.sent_at: She sent it on 12 August at 16:26.
  evidence.nihan_warning.findings.requested_redaction: She specifically asked for the source's identity to be removed.
  evidence.nihan_warning.findings.acknowledged: Leyla never acknowledged the warning.
  evidence.facilities_chat.title: Confidential-box correspondence
  evidence.facilities_chat.description: Nihan's earlier messages with building facilities.
  evidence.facilities_chat.findings.actor: Nihan asked the facilities team for information.
  evidence.facilities_chat.findings.asked_about: She asked about a blue confidential-document box.
  evidence.facilities_chat.findings.pickup_at: The boxes are due for pickup at 21:45.
  evidence.facilities_chat.findings.lookup: Facilities told her to use the confidential blue route lookup.
  evidence.building_route.title: Confidential blue box route
  evidence.building_route.description: The building's routing entry for confidential boxes on the fourth floor.
