schema: case-test/v0.1
case: {id: community.fka.yedi-dakika, version: 0.4.1}

scenario:
  id: contact_discovery
  perspective: detective
  description: Leyla's statement names Mert, then the authored note offers a directory lookup before Mert can be called.
  steps:
    - expect:
        state:
          clocks: {case-time: 0s}
          contacts:
            leyla: listed
            mert: hidden
            nihan: hidden
            can: hidden
          affordances:
            locate_mert_contact: hidden
            locate_nihan_contact: offered
            interview_leyla: offered
            interview_mert_location: hidden
            interview_nihan: hidden

    - detective.act: {action: interview, actor: mert, topic: location}
      expect:
        result: {status: denied, code: affordance-unavailable}
        state:
          clocks: {case-time: 0s}
          contacts: {mert: hidden}

    - detective.act: {action: locate-contact, target: mert}
      expect:
        result: {status: denied, code: affordance-unavailable}
        state:
          clocks: {case-time: 0s}
          contacts: {mert: hidden}

    - detective.act: {action: interview, actor: leyla}
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 2m}
          contacts: {mert: hidden}

    - expect:
        state:
          contacts: {mert: hidden}
          affordances:
            locate_mert_contact: offered
            interview_mert_location: hidden

    - detective.act: {action: locate-contact, target: mert}
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 2m}
          contacts: {mert: listed, nihan: hidden}
          affordances:
            locate_mert_contact: hidden
            locate_nihan_contact: offered
            interview_mert_location: offered

    - detective.act: {action: locate-contact, target: nihan}
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 2m}
          contacts: {mert: listed, nihan: listed, can: hidden}
          affordances:
            locate_nihan_contact: hidden
            interview_nihan: offered

    - detective.act: {action: interview, actor: mert, topic: location}
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 5m}
          evidence: {mert_receipt: available}

    - detective.act: {action: interview, actor: nihan}
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 8m}
