schema: case-test/v0.1
case: {id: community.fka.yedi-dakika, version: 0.4.1}

scenario:
  id: full_solution
  perspective: detective
  steps:
    - detective.act: {action: interview, actor: mert, topic: location}
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 3m}
          evidence: {mert_receipt: available}

    - detective.observe: mert_receipt
      expect:
        result: {status: accepted}
        state:
          evidence: {mert_receipt: observed}
          observations: {mert_receipt.paid_at: "21:01:12"}

    - detective.act: {action: request, from: leyla, topic: lobby-video}
    - detective.observe: lobby_video
    - detective.act: {action: request, from: leyla, topic: camera-sync}
    - detective.observe: camera_sync_notice
      expect:
        state:
          affordances: {deduce_camera_time: offered}

    - detective.deduce: camera_time_corrected
      expect:
        result: {status: accepted}
        state:
          deductions: {camera_time_corrected: supported}
          observations:
            lobby_video.screen_exit_at: "21:04"
            camera_sync_notice.clock_offset: "+7m"

    - detective.act: {action: request, from: leyla, topic: printer-log}
    - detective.observe: printer_log
      expect:
        state:
          affordances: {deduce_mert_no_opportunity: offered}

    - detective.deduce: mert_no_opportunity
      expect:
        result: {status: accepted}
        state:
          deductions: {mert_no_opportunity: supported}
          evidence:
            access_log: hidden
            desk_camera: hidden
          affordances:
            request_access_log: offered
            request_desk_camera: offered

    - detective.act: {action: request, from: leyla, topic: access-log}
    - detective.act: {action: request, from: leyla, topic: desk-camera}
    - detective.observe: access_log
    - detective.observe: desk_camera
      expect:
        state:
          affordances: {deduce_nihan_took_file: offered}

    - detective.deduce: nihan_took_file
      expect:
        result: {status: accepted}
        state:
          deductions: {nihan_took_file: supported}
          evidence:
            interview_draft: hidden
            nihan_warning: hidden
            facilities_chat: hidden
          affordances:
            request_interview_draft: offered
            request_facilities_chat: offered

    - detective.act: {action: request, from: leyla, topic: interview-draft}
    - detective.observe: interview_draft
      expect:
        state:
          affordances: {search_redaction_warning: offered}

    - detective.act:
        action: search
        query: "interview_draft_v12 redaction warning"
    - detective.observe: nihan_warning
      expect:
        state:
          affordances: {deduce_nihan_protected_source: offered}

    - detective.deduce: nihan_protected_source
      expect:
        result: {status: accepted}
        state:
          deductions: {nihan_protected_source: supported}
          affordances: {present_draft_to_nihan: offered}

    - detective.act: {action: request, from: leyla, topic: facilities-chat}
    - detective.observe: facilities_chat
      expect:
        state:
          affordances:
            search_building_route: offered
            recover_box_b11: offered

    - detective.act:
        action: present
        target: nihan
        evidence: interview_draft
        tone: empathetic
      expect:
        result: {status: accepted}
        state:
          evidence: {nihan_confession: available}

    - detective.observe: nihan_confession
    - detective.act:
        action: search
        query: "confidential-blue-route floor-four"
    - detective.observe: building_route
      expect:
        state:
          affordances: {deduce_file_in_b17: offered}

    - detective.deduce: file_in_b17
      expect:
        result: {status: accepted}
        state:
          deductions: {file_in_b17: supported}
          affordances:
            deduce_full_explanation: offered
            conclude_security: offered
            recover_box_b11: hidden

    - detective.deduce: full_explanation
      expect:
        result: {status: accepted}
        state:
          deductions: {full_explanation: supported}
          affordances: {conclude_mediate: offered}

    - detective.conclude: mediate
      expect:
        result: {status: accepted}
        state:
          clocks: {case-time: 24m}
          final_conclusion: mediate
          outcome: all_protected
          assessment: {score: 100, max_score: 100}
          evidence: {recovered_file: available}
